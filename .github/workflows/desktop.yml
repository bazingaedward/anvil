name: Desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep for harness tests
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - run: npm test
        if: runner.os == 'macOS'
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run package:dir
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-tests-${{ matrix.os }}
          path: test-results/
