appId: dev.anvil.desktop
productName: Anvil
asar: true
npmRebuild: true
directories:
  output: release
files:
  - out/**
  - package.json
mac:
  category: public.app-category.developer-tools
  target: dmg
  extraResources:
    - from: runtime/opencode/dist/anvil-runtime
      to: runtime/anvil-runtime
    - from: runtime/opencode/dist/opencode-pty
      to: runtime/opencode-pty
win:
  target: nsis
  extraResources:
    - from: runtime/opencode/dist/anvil-runtime.exe
      to: runtime/anvil-runtime.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
